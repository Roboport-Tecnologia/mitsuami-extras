[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["David Rios <david.rios.gomes@gmail.com>"]
repository = "https://github.com/Roboport-Tecnologia/mitsuami-extras"

# The sibling checkout of mitsuami (`../rust-ui-toolkit`), for what it adds
# before its next release: the placeholder colour, click-through and the
# text area's insets. Back to its published version once it's out.
[workspace.dependencies]
mitsuami = { path = "../rust-ui-toolkit/crates/mitsuami", version = "1.3.7" }
mitsuami-test = { path = "../rust-ui-toolkit/crates/mitsuami-test", version = "1.3.7" }
# mitsuami's C ABI isn't published: the sibling checkout's, always.
mitsuami-ffi = { path = "../rust-ui-toolkit/crates/mitsuami-ffi" }
