[package]
name = "mitsuami-extras-ffi"
description = "mitsuami and mitsuami-extras over one C ABI, for bindings to other languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Not published until the ABI settles, as mitsuami's.
publish = false

[lib]
name = "mitsuami_extras_ffi"
crate-type = ["cdylib", "rlib"]

[features]
# Qt Quick and Kirigami instead of GTK 4 on Linux, as mitsuami's.
kde = ["mitsuami-ffi/kde", "mitsuami/kde"]

[dependencies]
mitsuami.workspace = true
mitsuami-extras = { path = "../mitsuami-extras" }
mitsuami-ffi.workspace = true

[dev-dependencies]
mitsuami-test.workspace = true

[[test]]
name = "ffi"
harness = false
